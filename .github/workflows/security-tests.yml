name: Security rendering tests

on:
  push:
    branches: [main, release1/safe-rendering]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify committed app has no HTML rendering sinks
        run: |
          if grep -nE 'innerHTML|outerHTML|insertAdjacentHTML|document\.write\s*\(' rollover-budget-app.html; then
            echo "::error::HTML rendering sink found in committed app"
            exit 1
          fi
      - name: Run security rendering tests
        run: node --test tests/security-rendering.test.mjs
