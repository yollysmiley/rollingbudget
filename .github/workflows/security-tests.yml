name: Security and database policy tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate production security contracts
        run: node --test tests/ci-contract.test.js
