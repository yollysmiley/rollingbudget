name: Production CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    name: Unit, syntax, and security contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check scripts/legacy-budget-migration.js
          node --check tests/legacy-budget-migration.test.js
          node --check tests/ci-contract.test.js
      - name: Run unit, regression, and security contract tests
        run: node --test tests/*.test.js

  browser-smoke:
    name: Desktop and mobile browser smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser smoke tests
        run: node --test tests/browser-smoke.test.mjs
      - name: Build isolated production preview for browser acceptance
        run: node scripts/build-production-preview.mjs
      - name: Run preview desktop and mobile browser acceptance tests
        run: node --test tests/production-preview-browser.test.mjs
      - name: Run isolated synthetic authentication browser tests
        run: node --test tests/production-preview-synthetic-auth.test.mjs
      - name: Verify protected preview rejects missing or invalid sessions
        run: node --test tests/production-preview-auth-gate-browser.test.mjs
      - name: Verify desktop/mobile confirmation and recovery callback regressions
        run: node --test tests/production-preview-auth-callback-browser.test.mjs
      - name: Verify owner-scoped account and recurring CRUD contracts
        run: node --test tests/production-preview-owner-crud.test.mjs
      - name: Verify recurring backfill, idempotency and cloud conflict hardening
        run: node --test tests/production-preview-recurring-hardening.test.mjs
      - name: Verify synthetic authenticated session and desktop/mobile navigation
        run: node --test tests/production-preview-session-navigation-browser.test.mjs

  production-schema-upgrade:
    name: Production-shaped PostgreSQL upgrade regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: production_upgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d production_upgrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: production_upgrade_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate upgrade script syntax
        run: |
          bash -n scripts/verify-production-upgrade.sh
          bash -n scripts/verify-production-restore.sh
      - name: Replay additive migrations and rehearse synthetic backup restoration
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" mkdir -p /tmp/rollingbudget-ci/scripts /tmp/rollingbudget-ci/supabase/migrations /tmp/rollingbudget-ci/tests
          docker cp scripts/verify-production-upgrade.sh "$POSTGRES_CONTAINER:/tmp/rollingbudget-ci/scripts/"
          docker cp scripts/verify-production-restore.sh "$POSTGRES_CONTAINER:/tmp/rollingbudget-ci/scripts/"
          docker cp tests/legacy-budget-access-runtime.sql "$POSTGRES_CONTAINER:/tmp/rollingbudget-ci/tests/"
          docker cp tests/default-privileges-runtime.sql "$POSTGRES_CONTAINER:/tmp/rollingbudget-ci/tests/"
          docker cp supabase/migrations/. "$POSTGRES_CONTAINER:/tmp/rollingbudget-ci/supabase/migrations/"
          docker exec -i \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=postgres \
            -e PGPASSWORD=test-only -e PGDATABASE=production_upgrade_test \
            -w /tmp/rollingbudget-ci "$POSTGRES_CONTAINER" bash -euo pipefail -c '
              for tool in psql pg_dump pg_restore createdb; do
                "$tool" --version
                "$tool" --version | grep -E "PostgreSQL[)] 17[.]"
              done
              psql -X -v ON_ERROR_STOP=1 -c "SELECT current_database(), version();"
              bash scripts/verify-production-restore.sh
            '

  production-preview-build:
    name: Isolated production preview build and auth contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check preview build syntax
        run: node --check scripts/build-production-preview.mjs
      - name: Build preview without deployment
        run: node scripts/build-production-preview.mjs
      - name: Validate production auth and isolation contracts
        run: node --test tests/production-preview.test.mjs
      - name: Verify preview navigation and auth isolation contracts
        run: node --test tests/production-preview-navigation.test.mjs

      - name: Build release artifact without deployment
        run: node scripts/build-production-release.mjs
      - name: Validate release artifact contracts
        run: node --test tests/production-release.test.mjs

  encrypted-backup-regression:
    name: Synthetic encrypted backup restoration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install encryption tool
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Validate backup script syntax
        run: |
          bash -n scripts/backup-production.sh
          bash -n scripts/verify-encrypted-backup.sh
      - name: Verify encrypted backup restoration
        run: bash scripts/verify-encrypted-backup.sh

  backup-runtime:
    name: Synthetic authorized backup runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: bash -n scripts/export-production-backup.sh tests/verify-authorized-backup.sh
      - run: bash tests/verify-authorized-backup.sh
      - uses: supabase/setup-cli@v1
        with:
          version: 2.79.0
      - run: bash -n tests/verify-supabase-cli-backup.sh
      - run: bash tests/verify-supabase-cli-backup.sh
